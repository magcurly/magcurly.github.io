{% extends "base.html" %}

{% block title %}{{ page.title }} | {{ config.title }}{% endblock %}

{% block content %}
<article>
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {% if page.date %}
    <div class="page-meta">{{ page.date | date(format="%B %d, %Y") }}</div>
    {% endif %}
  </header>
  <div class="page-content">
    {{ page.content | safe }}
  </div>
</article>
{% endblock %}

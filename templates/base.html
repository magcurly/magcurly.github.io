<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{{ config.description }}">
  <meta property="og:title" content="{{ config.title }}">
  <meta property="og:description" content="{{ config.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ config.base_url }}">
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="nav-logo" href="{{ config.base_url }}">{{ config.title }}</a>
      <div class="nav-links">
        <a href="{{ get_url(path='@/blog/_index.md') }}">Blog</a>
        <a href="{{ get_url(path='@/about.md') }}">About</a>
      </div>
    </div>
  </nav>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>&copy; {{ now() | date(format="%Y") }} {{ config.extra.author }}. Built with <a href="https://www.getzola.org" target="_blank" rel="noopener">Zola</a>.</p>
  </footer>
</body>
</html>
